[package]
name = "agent-tui-bin"
version = "0.1.220-alpha.4"
edition.workspace = true
license = "Apache-2.0"
authors = ["Agent TUI contributors"]
default-run = "agent-tui"

# ONE CORE + ADDONS — one linked binary. Product skins are symlinks to `agent-tui`
# (see scripts/link-product-bins.sh). Identity from argv[0] / AGENT_TUI_PRODUCT.
#
# This package links the pager library + optional pager-minimal (minimal depends
# on pager, so the pager cannot depend back — no cargo cycle).

[lib]
name = "agent_tui_bin"
path = "src/lib.rs"

[[bin]]
name = "agent-tui"
path = "src/main.rs"

[dependencies]
agent-tui-pager = { path = "../agent-tui-pager" }
agent-tui-pager-minimal = { path = "../agent-tui-pager-minimal" }

agent-tui-shell = { workspace = true }
agent-tui-update = { path = "../agent-tui-update" }
agent-tui-version = { workspace = true }
agent-tui-telemetry = { workspace = true }
agent-tui-workspace = { workspace = true }
agent-tui-crash-handler = { path = "../agent-tui-crash-handler" }
agent-tui-acp-lib = { workspace = true }

tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
semver = { workspace = true }
agent-tui-tty-utils = { workspace = true }
agent-tui-config = { workspace = true }
agent-tui-sandbox = { path = "../agent-tui-sandbox", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }

obfstr = { workspace = true }
cryptify = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
tikv-jemallocator = { workspace = true, optional = true, features = ["stats"] }
tikv-jemalloc-sys = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true, features = ["stats", "use_std"] }

[dev-dependencies]
serial_test = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[features]
default = [
    "jemalloc",
    "sandbox-enforce",
    ]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
sandbox-enforce = ["agent-tui-pager/sandbox-enforce"]
release-dist = ["agent-tui-pager/release-dist"]
