[package]
license = "Apache-2.0"
name = "agent-tui-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the grok CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
agent-tui-auth = { workspace = true, features = ["middleware"] }
agent-tui-extra-ca = { workspace = true }
agent-tui-sampler = { path = "../agent-tui-sampler" }
agent-tui-telemetry = { workspace = true }
agent-tui-version = { workspace = true }
agent-tui-workspace = { workspace = true }

[lints]
workspace = true
