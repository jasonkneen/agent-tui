# Lightweight CI for the Agent TUI fork — compile-check on PRs and main.
# Full multi-platform release builds live in release.yml (tag push).

name: CI

on:
  push:
    branches: [main, master, "fork/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.92.0

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      # Windows has no shebang support, so `bin/protoc` (a DotSlash launcher)
      # is not directly executable. find_protoc resolves it via `dotslash --
      # fetch` and otherwise falls back to PATH, which is what this installs —
      # matching how release.yml builds the Windows target.
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: Check agent-tui-bin
        run: cargo check -p agent-tui-bin

      - name: Check agent-tui-update
        run: cargo check -p agent-tui-update

      - name: Unit tests (update crate)
        run: cargo test -p agent-tui-update --lib

      # Guards the cross-platform protoc/depfile handling in
      # agent-tui-proto-build against Unix-only regressions.
      - name: Unit tests (proto-build)
        run: cargo test -p agent-tui-proto-build
