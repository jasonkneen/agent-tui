# Build multi-platform Agent TUI binaries and publish a GitHub Release.
#
# Maintainer guide: RELEASING.md (repo root)
# Agent notes:      AGENTS.md
#
# Triggers:
#   - Push of a version tag: v1.2.3 or v1.2.3-alpha.1
#   - Manual workflow_dispatch (optional version override)
#
# Asset naming (matches agent-tui-update + install.sh):
#   agent-tui-{version}-{os}-{arch}[.exe]
#   os:   macos | linux | windows
#   arch: x86_64 | aarch64
#
# Canonical repo: jasonkneen/agent-tui

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.1.220). Empty = tag name or date stamp."
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            asset_os: macos
            asset_arch: aarch64
            exe: agent-tui
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            asset_os: macos
            asset_arch: x86_64
            exe: agent-tui
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: x86_64
            exe: agent-tui
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: x86_64
            exe: agent-tui.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install protoc (system)
        if: runner.os != 'Windows'
        run: |
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install protobuf
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Build release binary
        shell: bash
        env:
          AGENT_TUI_VERSION: ${{ steps.ver.outputs.version }}
          GROK_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Host-native build when target matches the runner; otherwise --target.
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$HOST" = "${{ matrix.target }}" ]; then
            cargo build --profile release-dist -p agent-tui-bin --features release-dist
            BIN="target/release-dist/${{ matrix.exe }}"
          else
            cargo build --profile release-dist -p agent-tui-bin --features release-dist --target ${{ matrix.target }}
            BIN="target/${{ matrix.target }}/release-dist/${{ matrix.exe }}"
          fi
          test -f "$BIN"
          # Strip on Unix to shrink download size (debug info already optional).
          if [ "${{ runner.os }}" != "Windows" ] && command -v strip >/dev/null 2>&1; then
            strip "$BIN" || true
          fi
          ls -lh "$BIN"
          echo "bin_path=$BIN" >> "$GITHUB_OUTPUT"
        id: build

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          ASSET="agent-tui-${V}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}"
          if [ "${{ matrix.asset_os }}" = "windows" ]; then
            ASSET="${ASSET}.exe"
          fi
          cp "${{ steps.build.outputs.bin_path }}" "$ASSET"
          # Checksum for verification
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          else
            sha256sum "$ASSET" > "${ASSET}.sha256"
          fi
          ls -lh "$ASSET"*
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
        id: pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (for notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: find dist -type f | sort && ls -lh dist/

      - name: Resolve version + prerelease flag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$V" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Agent TUI v${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/agent-tui-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
